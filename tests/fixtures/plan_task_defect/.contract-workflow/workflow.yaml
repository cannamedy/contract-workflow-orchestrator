version: "1"
project:
  name: generic-plan-defect-fixture
  path: .
mode: gated
authoritative_sources: []
skills: {}
runner:
  type: mock
  mock_outcomes:
    TASK_EXECUTION: {verdict: APPROVED, summary: task implemented}
    TASK_INDEPENDENT_REVIEW: {verdict: PLAN_TASK_DEFECT, summary: plan omits required verification}
    PLAN_DEFECT_RESOLUTION: {verdict: APPROVED, summary: revised plan produced}
    PLAN_REVISION_REVIEW: {verdict: APPROVED, summary: revised plan approved}
    FINAL_VERIFICATION: {verdict: COMPLETED, summary: final verification complete}
policy:
  auto_patch: true
  auto_rereview: true
  auto_plan_defect_resolution: true
  auto_plan_revision_review: true
  auto_commit_checkpoint: false
  auto_push: false
  auto_tag: false
  max_attempts_per_stage: 2
  max_total_steps: 50
  retry_backoff_seconds: 0
groups:
  - id: generic-group
    tasks:
      - id: generic-task
